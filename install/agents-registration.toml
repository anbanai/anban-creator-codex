# Codex subagent registration — append (or merge) into ~/.codex/config.toml
#
# This file is consumed by install-subagents.sh. It registers the nine anban-creator
# subagents and enables the multi-agent feature flag.
#
# WARNING: do NOT paste this verbatim if your ~/.codex/config.toml already declares
# any of these tables. Run install-subagents.sh instead — it is idempotent.

[features]
multi_agent = true

[agents]
max_threads = 9

[agents.wechatarticle]
description = "微信公众号图文全自动创作引擎（选题 → 草稿）"
config_file = "~/.codex/agents/wechatarticle.toml"
nickname_candidates = ["Writer", "ArticleBot", "公众号写手"]

[agents.seednote]
description = "种草笔记全自动创作引擎（原创 + 复刻）"
config_file = "~/.codex/agents/seednote.toml"
nickname_candidates = ["NoteBot", "Seeder", "种草机器"]

[agents.moments]
description = "朋友圈素材包全自动创作 Agent（素材拆解 → 正文 → 质量复盘 → 归档）"
config_file = "~/.codex/agents/moments.toml"
nickname_candidates = ["Moments", "朋友圈写手", "PrivateDomain"]

[agents.designer]
description = "线稿批量上色与一致性审计引擎"
config_file = "~/.codex/agents/designer.toml"
nickname_candidates = ["Colorist", "Designer", "上色师"]

[agents.live-slicer]
description = "直播视频智能切片引擎（ffmpeg + 听悟 + 剪映草稿）"
config_file = "~/.codex/agents/live-slicer.toml"
nickname_candidates = ["Slicer", "Cutter", "切片机"]

[agents.videocreator]
description = "AI 视频生成引擎（创意 brief → Seedance 生成 → 成片交付）"
config_file = "~/.codex/agents/videocreator.toml"
nickname_candidates = ["VideoCreator", "Director", "AI视频生成"]

[agents.videoeditor]
description = "视频剪辑后期引擎（素材整理 → 字幕/包装 → EDL/剪映草稿/成片）"
config_file = "~/.codex/agents/videoeditor.toml"
nickname_candidates = ["VideoEditor", "Post", "视频剪辑"]

[agents.ecommerce]
description = "电商出图全自动执行引擎（多产品图 → 主图/详情/封面/分享/SKU，保证产品跨图一致）"
config_file = "~/.codex/agents/ecommerce.toml"
nickname_candidates = ["ShopBot", "Merchant", "电商出图师"]

[agents.openmontage]
description = "OpenMontage 视频生产引擎（业务 brief + 素材 → OpenMontage pipeline → 成片交付）"
config_file = "~/.codex/agents/openmontage.toml"
nickname_candidates = ["OpenMontage", "Montage", "视频生产"]
